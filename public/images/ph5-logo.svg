<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200">
  <!-- Background transparent -->
  <rect width="400" height="200" fill="none"/>
  
  <!-- Outer Oval border as seen in some logo variations in the PDF -->
  <ellipse cx="200" cy="90" rx="70" ry="85" fill="none" stroke="#7C1824" stroke-width="2"/>
  
  <!-- "P" and "H" parallel lines -->
  <path d="M 170,140 V 60 Q 200,60 200,90 Q 200,120 170,120" fill="none" stroke="#7C1824" stroke-width="6"/>
  <path d="M 210,50 V 150" fill="none" stroke="#7C1824" stroke-width="6"/>
  
  <!-- "5" overlapping slightly -->
  <text x="210" y="130" font-family="sans-serif" font-size="64" fill="#CE4927" font-weight="bold">5</text>
  
  <!-- AESTHETICS text below -->
  <text x="200" y="190" font-family="sans-serif" font-size="14" fill="#151515" text-anchor="middle" letter-spacing="6">AESTHETICS</text>
</svg>
